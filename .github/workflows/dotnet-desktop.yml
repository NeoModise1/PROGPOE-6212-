name: RaceDay

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: raceday-${{ github.ref }}
  cancel-in-progress: true

env:
  SOLUTION: RaceDay/RaceDay.sln

jobs:
  check-files:
    name: Check required files exist
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify required files
        shell: bash
        run: |
          # Each entry may live at the repo root or inside the RaceDay/ folder.
          required_files=(
            "README.md"
            "schema.sql"
            "RaceDay.sln"
          )
          missing=0
          for f in "${required_files[@]}"; do
            if [ -f "$f" ]; then
              echo "✔ Found: $f"
            elif [ -f "RaceDay/$f" ]; then
              echo "✔ Found: RaceDay/$f"
            else
              echo "::error::Missing required file: $f (looked in repo root and RaceDay/)"
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo "::error::One or more required files are missing."
            exit 1
          fi

  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore "$SOLUTION"

      - name: Build
        run: dotnet build "$SOLUTION" --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test "$SOLUTION" --configuration Release --no-build --verbosity normal
