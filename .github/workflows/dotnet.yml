name: RaceDay CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Show repository files (for debugging)
        run: find . -not -path "./.git/*" \( -name "Dockerfile" -o -name "RaceDay.sln" \)

      - name: Locate solution folder
        id: locate
        shell: bash
        run: |
          SLN=$(find . -name "RaceDay.sln" | head -n 1)
          if [ -z "$SLN" ]; then echo "::error::RaceDay.sln not found"; exit 1; fi
          echo "dir=$(dirname "$SLN")" >> "$GITHUB_OUTPUT"

      - name: Restore
        working-directory: ${{ steps.locate.outputs.dir }}
        run: dotnet restore RaceDay.sln

      - name: Build
        working-directory: ${{ steps.locate.outputs.dir }}
        run: dotnet build RaceDay.sln --configuration Release --no-restore

      - name: Run unit tests
        working-directory: ${{ steps.locate.outputs.dir }}
        run: dotnet test RaceDay.sln --configuration Release --no-build --verbosity normal

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API image
        shell: bash
        run: |
          DF=$(find . -path "*/src/RaceDay.Api/Dockerfile" | head -n 1)
          if [ -z "$DF" ]; then echo "::error::API Dockerfile not found"; find . -not -path "./.git/*" | head -100; exit 1; fi
          CTX=$(dirname "$(dirname "$(dirname "$DF")")")
          echo "Dockerfile: $DF   Context: $CTX"
          docker build -f "$DF" -t raceday-api "$CTX"

      - name: Build MVC image
        shell: bash
        run: |
          DF=$(find . -path "*/src/RaceDay.Web/Dockerfile" | head -n 1)
          if [ -z "$DF" ]; then echo "::error::Web Dockerfile not found"; exit 1; fi
          CTX=$(dirname "$(dirname "$(dirname "$DF")")")
          echo "Dockerfile: $DF   Context: $CTX"
          docker build -f "$DF" -t raceday-web "$CTX"
          
