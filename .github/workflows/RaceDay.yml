name: Validate RaceDay Repo
on:
  push:
  pull_request:
jobs:
  check-files:
    Name: Check required files exist
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Verify required files
        shell: bash
        run: |
          required_files=(
            "README.md"
            "docx/Schema.sql"
          )
          missing=0
          for f in "${required_files[@]}"; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing required file: $f"
              missing=1
            else
              echo "✔ Found: $f"
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo "::error::One or more required files are missing."
            exit 1
          fi
  validate-Sql:
    name: Validate SQL structure
    runs-on: ubuntu-latest
    needs: check-files
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "YourStrong!Passw0rd1"
        ports:
          - 1433:1433
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install sqlcmd
        shell: bash
        run: |
          curl -sSL https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc
          curl -sSL https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18 unixodbc-dev
          echo "/opt/mssql-tools18/bin" >> "$GITHUB_PATH"
      - name: Wait for SQL Server to be ready
        shell: bash
        run: |
          for i in {1..30}; do
            if /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong!Passw0rd1' -C -Q "SELECT 1" > /dev/null 2>&1; then
              echo "SQL Server is ready."
              break
            fi
            echo "Waiting for SQL Server... ($i)"
            sleep 3
          done
      - name: Create test database
        shell: bash
        run: |
          sqlcmd -S localhost -U sa -P 'YourStrong!Password1' -C \
            -Q "IF DB_ID('RaceDays') IS NULL CREATE DATABASE RaceDays;"
      - name: Run Schema.sql (structure + data check)
        shell: bash
        run: |
          sqlcmd -S localhost -U sa -P 'YourStrong!Passw0rd1' -C \
            -d RaceDays -i docx/Schema.sql -b
          echo "✔ Schema.sql ran without error."
      - name: Sanity-check row counts
        shell: bash
        run: |
          sqlcmd -S localhost -U sa -P 'YourStrong!Passw0rd1' -C -d RaceDays -b -Q "
            SELECT 'USERS' AS TableName, COUNT(*) AS Rows FROM dbo.USERS
            UNION ALL SELECT 'EVENTS', COUNT(*) FROM dbo.EVENTS
            UNION ALL SELECT 'CATEGORIES', COUNT(*) FROM dbo.CATEGORIES
            UNION ALL SELECT 'EVENT_CATEGORIES', COUNT(*) FROM dbo.EVENT_CATEGORIES
            UNION ALL SELECT 'USER_EVENTS', COUNT(*) FROM dbo.USER_EVENTS
            UNION ALL SELECT 'ENROLLMENTS', COUNT(*) FROM dbo.ENROLLMENTS
            UNION ALL SELECT 'RESULTS', COUNT(*) FROM dbo.RESULTS
            UNION ALL SELECT 'ROUTES', COUNT(*) FROM dbo.ROUTES
            UNION ALL SELECT 'WEATHER_INFORMATION', COUNT(*) FROM dbo.WEATHER_INFORMATION;
          "
