name: RaceDay CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore RaceDay.sln

      # Builds every project in the solution: RaceDay.Api (Part 2), RaceDay.Web (Part 3 MVC) and the tests.
      - name: Build
        run: dotnet build RaceDay.sln --configuration Release --no-restore

      - name: Build MVC project
        run: dotnet build src/RaceDay.Web/RaceDay.Web.csproj --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test RaceDay.sln --configuration Release --no-build --verbosity normal

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f src/RaceDay.Api/Dockerfile -t raceday-api .

      - name: Build MVC image
        run: docker build -f src/RaceDay.Web/Dockerfile -t raceday-web .
